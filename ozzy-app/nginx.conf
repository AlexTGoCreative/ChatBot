# Serves the built SPA and reverse-proxies the two backends so the browser only
# ever talks to this one origin.
server {
    listen 80;
    server_name _;

    # File uploads go through /api to ozzy-api; allow large bodies.
    client_max_body_size 2G;

    root /usr/share/nginx/html;
    index index.html;

    # ozzy-api (auth, scans, history, engine config). The trailing slash on
    # proxy_pass strips the /api/ prefix: /api/auth/login -> /auth/login.
    location /api/ {
        proxy_pass http://ozzy-api:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # Stream large uploads directly to upstream instead of buffering 2 GB in nginx.
        proxy_request_buffering off;
    }

    # ozzy-ai RAG chat. /ask and /ask/stream both live under this prefix.
    # Disable buffering so SSE streaming responses flush to the client.
    location /ask {
        proxy_pass http://ozzy-ai:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA fallback — let client-side routing handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
