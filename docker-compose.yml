version: "3.9"

services:
  ozzy-app:
    build: ./ozzy-app
    ports:
      - "5173:5173"
    depends_on:
      - ozzy-api
      - ozzy-ai
    environment:
      - VITE_API2_URL=http://ozzy-api:5000

  ozzy-api:
    build: ./ozzy-api
    ports:
      - "5000:5000"
    env_file:
      - ./ozzy-api/.env
    depends_on:
      - mongo

  ozzy-ai:
    build: ./ozzy-ai
    ports:
      - "7860:7860"
    env_file:
      - ./ozzy-ai/.env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
