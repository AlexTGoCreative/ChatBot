version: "3.9"

services:
  ozzy-app:
    build: ./ozzy-app
    ports:
      - "5173:5173"
    depends_on:
      - ozzy-api
      - ozzy-ai
    environment:
      - VITE_API2_URL=http://ozzy-api:5000

  ozzy-api:
    build: ./ozzy-api
    ports:
      - "5000:5000"
    env_file:
      - ./ozzy-api/.env

  ozzy-ai:
    build: ./ozzy-ai
    ports:
      - "7860:7860"
    env_file:
      - ./ozzy-ai/.env


